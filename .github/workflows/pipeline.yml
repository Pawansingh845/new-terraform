name: Terraform Deploy

on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Terraform Files
        shell: powershell
        run: |
          Write-Host "WORKSPACE = $env:GITHUB_WORKSPACE"
          Write-Host "CURRENT DIRECTORY = $(Get-Location)"
          Write-Host "ROOT FILES:"
          Get-ChildItem -Force

          Write-Host "TERRAFORM FILES:"
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "*.tf" | Select-Object FullName

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: terraform init

      - name: Terraform Validate
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: terraform validate

      - name: Terraform Plan
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: terraform plan
